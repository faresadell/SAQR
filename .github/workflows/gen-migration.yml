name: Generate baseline migration
on:
  push:
    branches: [gen-migration]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Build baseline migration (schema DDL + manual protections)
        run: |
          D=prisma/migrations/20261030000000_baseline
          mkdir -p $D
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          {
            echo "-- Baseline: tables/enums/indexes generated by 'prisma migrate diff' from prisma/schema.prisma"
            npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script
            for f in prisma/manual/00*.sql; do echo; echo "-- ===== $f ====="; cat "$f"; done
          } > $D/migration.sql
          wc -l $D/migration.sql
      - name: Verify it applies on an empty database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Report drift (indexes created only by manual SQL are expected here)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script || true
      - name: Commit migration back to this branch
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "Add baseline migration generated and verified in CI"
          git push origin HEAD:gen-migration
