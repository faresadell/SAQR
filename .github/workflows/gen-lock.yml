name: Generate package-lock
on:
  push:
    branches: [gen-lock]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --dry-run
      - name: Commit lockfile
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package-lock.json generated in CI"
          git push origin HEAD:gen-lock
