name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Create schema and database-level protections
        run: |
          npx prisma db push --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/manual/001_constraints_and_triggers.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/manual/002_phase2_append_only.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/manual/003_phase3_catalog.sql
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
        env:
          DB_TRIGGERS_APPLIED: "1"
      - name: Migrations must match schema.prisma
        run: |
          psql "postgresql://ci:ci@localhost:5432/ci" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ci_migrations'
          DATABASE_URL="postgresql://ci:ci@localhost:5432/ci_migrations" npx prisma migrate deploy
          npx prisma migrate diff --from-url "postgresql://ci:ci@localhost:5432/ci_migrations" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          APP_URL: https://example.com
          SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0000
          DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          OTP_PROVIDER: disabled
          STORAGE_DIR: /tmp/saqr-ci-storage
      - run: npm run audit
