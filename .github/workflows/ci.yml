name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Apply real migrations (no db push) and check for drift
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Production build (next build)
        run: npm run build
        env:
          APP_URL: http://localhost:3000
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
          DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
        env:
          DB_TRIGGERS_APPLIED: "1"
      - name: Audit details (annotations)
        if: always()
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e 'const a=require("./audit.json");for(const [n,v] of Object.entries(a.vulnerabilities||{})){const via=v.via.map(x=>typeof x==="string"?x:x.title+" "+(x.range||"")).join(" | ");console.log("::warning title=audit "+n+" ["+v.severity+"]::fix="+JSON.stringify(v.fixAvailable)+" range="+v.range+" via "+via.slice(0,300))}'
      - run: npm run audit
