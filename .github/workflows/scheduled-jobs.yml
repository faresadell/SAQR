name: Scheduled jobs

# Calls the app's idempotent maintenance jobs every 5 minutes (delivery timeouts, notification emails, plans, refunds ...).
# Needs two repository secrets: SITE_URL (e.g. https://www.saqr.sale) and CRON_SECRET (the same value as in Vercel).
# Without them the job does nothing; the app also runs the delivery timeouts and emails opportunistically when people use it.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the jobs endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET not set: skipping"; exit 0; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 120 "$SITE_URL/api/internal/jobs/all")
          echo "status: $code"
          [ "$code" = "200" ]
