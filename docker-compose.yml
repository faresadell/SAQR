# Local development database only. Do not use these credentials in production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: saqr
      POSTGRES_PASSWORD: saqr_dev_password
      POSTGRES_DB: saqr
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["saqr_pg:/var/lib/postgresql/data"]
volumes:
  saqr_pg:
